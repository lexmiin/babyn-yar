name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8000/v1

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: detect api changes
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'migrations/**'
              - 'justfile'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/checks.yaml'

      - name: set up nix
        uses: cachix/install-nix-action@v31.11.1

      - name: resolve pnpm store
        id: pnpm-store
        run: |
          if ! store_path="$(nix develop .#ci --command pnpm store path --silent)"; then
            echo "failed to resolve pnpm store path" >&2
            exit 1
          fi
          if [[ -z "$store_path" ]]; then
            echo "pnpm store path is empty" >&2
            exit 1
          fi
          printf 'path=%s\n' "$store_path" >> "$GITHUB_OUTPUT"

      - name: restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-11-

      - name: restore go module cache
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-mod-

      - name: restore go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ hashFiles('flake.nix', 'flake.lock', 'apps/api/go.sum') }}

      - name: install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile

      - name: build
        run: nix develop .#ci --command pnpm run build

      - name: api integration test
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        run: nix develop .#ci --command just test
