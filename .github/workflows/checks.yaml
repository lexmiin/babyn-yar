name: checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8000/v1

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up nix
        uses: cachix/install-nix-action@v31.11.1

      - name: resolve pnpm store
        id: pnpm-store
        run: |
          if ! store_path="$(nix develop --command pnpm store path --silent)"; then
            echo "failed to resolve pnpm store path" >&2
            exit 1
          fi
          if [[ -z "$store_path" ]]; then
            echo "pnpm store path is empty" >&2
            exit 1
          fi
          printf 'path=%s\n' "$store_path" >> "$GITHUB_OUTPUT"

      - name: restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-11-

      - name: restore go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles('flake.lock', 'apps/api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: build
        run: nix develop --command pnpm run build

      - name: build production API package
        run: nix build .#api

      - name: api integration test
        run: nix develop --command just test
