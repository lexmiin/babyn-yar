name: release
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ACTOR: ${{ github.repository_owner }}

jobs:
  version:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # same format as the check in scripts/deploy.sh
      - name: validate tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "release tag must look like v2026.11.09 or v2026.11.09.1, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/checks.yaml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: build ${{ matrix.app }} ${{ matrix.arch }} image
    needs: [version, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - app: gov
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: ./apps/gov/Dockerfile
            image: babyn-yar-gov

          - app: admin
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: ./apps/admin/Dockerfile
            image: babyn-yar-admin

          - app: api
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: ./apps/api/Dockerfile
            image: babyn-yar-api

          - app: gov
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./apps/gov/Dockerfile
            image: babyn-yar-gov

          - app: admin
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./apps/admin/Dockerfile
            image: babyn-yar-admin

          - app: api
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./apps/api/Dockerfile
            image: babyn-yar-api

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: resolve tool versions
        id: tools
        shell: bash
        run: |
          pnpm_version="$(jq -r '.packageManager | capture("^pnpm@(?<version>.+)$").version' package.json)"
          turbo_version="$(jq -r '.devDependencies.turbo' package.json)"

          if [[ ! "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "packageManager must contain an exact pnpm version" >&2
            exit 1
          fi
          if [[ ! "$turbo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "devDependencies.turbo must contain an exact version" >&2
            exit 1
          fi

          echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"
          echo "turbo-version=$turbo_version" >> "$GITHUB_OUTPUT"

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ACTOR }}
          password: ${{ secrets.PAT }}

      - name: build and push ${{ matrix.app }} ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            PNPM_VERSION=${{ steps.tools.outputs.pnpm-version }}
            TURBO_VERSION=${{ steps.tools.outputs.turbo-version }}
            API_URL=${{ secrets.API_URL }}
            PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
          secrets: |
            "sentry-org=${{ secrets.SENTRY_ORG }}"
            "sentry-project=${{ secrets.SENTRY_PROJECT }}"
            "sentry-auth-token=${{ secrets.SENTRY_AUTH_TOKEN}}"
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.ACTOR }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # GHA caches are scoped per ref, so tag builds couldn't reuse them;
          # a registry cache is shared across releases.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ACTOR }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ACTOR }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "build did not produce a digest" >&2
            exit 1
          fi
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.app }} image
    runs-on: ubuntu-latest
    needs: [version, build]
    strategy:
      matrix:
        include:
          - app: gov
            image: babyn-yar-gov

          - app: admin
            image: babyn-yar-admin

          - app: api
            image: babyn-yar-api

    steps:
      - name: download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.ACTOR }}
          password: ${{ secrets.PAT }}

      - name: create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.ACTOR }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          digests=(*)
          if [ "${digests[0]}" = "*" ]; then
            echo "no digests downloaded" >&2
            exit 1
          fi

          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${TAG}" \
            "${refs[@]}"

  deploy:
    needs: [version, merge]
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: prune old images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.PAT }}
          image-names: 'babyn-yar-*'
          image-tags: '!buildcache-*'
          cut-off: 1w
          # each release is a rollback target; keep the last 10
          keep-n-most-recent: 10
          dry-run: false
